{% extends 'base.html' %}

{% block title %}404 - Page Not Found - Expense Tracker{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card-saas max-w-600 mx-auto p-5">
    <div class="display-1 text-primary fw-bold mb-2">404</div>
    <div class="fs-1 mb-3">🔍</div>
    <h3 class="fw-bold text-main mb-2">Page Not Found</h3>
    <p class="text-muted small mb-4">
      The page you're looking for does not exist or may have been moved.
    </p>
    <div>
      <a href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'home' %}{% endif %}" class="btn btn-primary-saas px-4 py-2">
        <i class="bi bi-house-door me-1"></i> Return to Safety
      </a>
    </div>
  </div>
</div>
{% endblock %}
