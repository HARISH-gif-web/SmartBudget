{% extends 'base.html' %}

{% block title %}Delete Category - Expense Tracker{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card-saas p-4 text-center">
        <div class="metric-icon-wrap bg-danger-subtle text-danger fs-2 mx-auto mb-3">
          <i class="bi bi-trash"></i>
        </div>
        
        <h4 class="fw-bold text-main mb-2">Delete Category?</h4>
        <p class="text-muted small mb-4">
          Are you sure you want to delete category <strong>"{{ category.icon }} {{ category.name }}"</strong>? 
          All associated expenses will also be removed.
        </p>

        <form method="post">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3">
            <button type="submit" class="btn btn-danger px-4 py-2 fw-semibold">
              Yes, Delete Category
            </button>
            <a href="{% url 'category_list' %}" class="btn btn-secondary-saas px-4 py-2">
              Cancel
            </a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
