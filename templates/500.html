{% extends 'base.html' %}

{% block title %}500 - Server Error - Expense Tracker{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="card-saas max-w-600 mx-auto p-5">
    <div class="display-1 text-warning fw-bold mb-2">500</div>
    <div class="fs-1 mb-3">⚙️</div>
    <h3 class="fw-bold text-main mb-2">Something Went Wrong</h3>
    <p class="text-muted small mb-4">
      An unexpected internal error occurred. Our team has been notified. Please try again later.
    </p>
    <div>
      <a href="{% url 'dashboard' %}" class="btn btn-primary-saas px-4 py-2">
        <i class="bi bi-arrow-repeat me-1"></i> Return to Dashboard
      </a>
    </div>
  </div>
</div>
{% endblock %}
